# @formatter:off

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop


covoit.app.defaultAdminEmail=test-admin@example.com
covoit.app.defaultAdminPassword=TestPassword123!

covoit.app.jwtSecret=monSecretDeTestTresLongPourEviterLesErreursDeTailleDeClef123456
covoit.app.jwtExpirationMs=3600000
covoit.app.jwtRefreshExpiration=86400000


spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=test@covoit.local


logging.level.root=INFO
logging.level.fr.greta.cda=DEBUG

# @formatter:on
